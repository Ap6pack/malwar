# Print the shape of the registry's skill-detail response.
#
# The dev sandbox cannot reach clawhub.ai, so questions about what the API
# actually returns can only be answered from CI. Structure only -- key names,
# types, and the owner/moderation values -- so the log is safe to share.

name: Inspect Detail Shape

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated slugs to inspect"
        type: string
        default: "accountant agents aegis4all"
      survey:
        description: "Count how often owner/moderation are populated instead of dumping each tree"
        type: boolean
        default: false
      content:
        description: "Print each skill's SKILL.md instead, to check a verdict against the file"
        type: boolean
        default: false
      mode:
        description: "ls = probe for a file listing; fetch = slugs are slug=path pairs"
        type: choice
        options: ["", "ls", "fetch"]
        default: ""

permissions:
  contents: read

jobs:
  inspect:
    name: Dump detail response structure
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install httpx
        run: pip install httpx

      - name: Inspect
        env:
          SLUGS: ${{ github.event.inputs.slugs }}
          SURVEY: ${{ github.event.inputs.survey }}
          CONTENT: ${{ github.event.inputs.content }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -n "$MODE" ]; then
            python scripts/inspect-detail-shape.py --$MODE $SLUGS
          elif [ "$CONTENT" = "true" ]; then
            python scripts/inspect-detail-shape.py --content $SLUGS
          elif [ "$SURVEY" = "true" ]; then
            python scripts/inspect-detail-shape.py --survey $SLUGS
          else
            python scripts/inspect-detail-shape.py $SLUGS
          fi
