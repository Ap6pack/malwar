# Re-verify a cohort of skills with the full LLM pipeline.
#
# The registry sweep does not escalate confident-MALICIOUS skills, because a
# second opinion cannot change an already-corroborated verdict. That is correct
# for monitoring but leaves any cohort selected after the fact (e.g. "malicious
# skills whose name markets them as a security tool") resting on rules alone.
#
# Publishing a cohort claim on rules alone is how you end up retracting a
# number. This runs manually, verifies the cohort, and prints what survives.

name: Verify Cohort

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Explicit comma-separated slugs (for a cohort defined by behaviour over time). Overrides slug_pattern."
        type: string
        default: ""
      slug_pattern:
        description: "Regex a slug must match to join the cohort (ignored if slugs is set)"
        type: string
        default: ""
      verdict:
        description: "Snapshot verdict to select"
        type: string
        default: "MALICIOUS"
      require_behavioural:
        description: "Drop members whose only evidence is a discussion-based rule"
        type: boolean
        default: true
      limit:
        description: "Cap cohort size (0 = no cap); bounds LLM spend"
        type: string
        default: "0"

concurrency:
  group: verify-cohort
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify cohort against the LLM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install malwar
        run: pip install -e "."

      - name: Fetch the current snapshot
        run: |
          mkdir -p data/registry-snapshots
          git fetch origin registry-snapshots
          git show origin/registry-snapshots:data/registry-snapshots/latest.json \
            > data/registry-snapshots/latest.json
          echo "Snapshot: $(jq -r .created_at data/registry-snapshots/latest.json)"

      - name: Verify cohort
        env:
          MALWAR_ANTHROPIC_API_KEY: ${{ secrets.MALWAR_ANTHROPIC_API_KEY }}
          SLUGS: ${{ github.event.inputs.slugs }}
          SLUG_PATTERN: ${{ github.event.inputs.slug_pattern }}
          VERDICT: ${{ github.event.inputs.verdict }}
          LIMIT: ${{ github.event.inputs.limit }}
          BEHAVIOURAL: ${{ github.event.inputs.require_behavioural }}
        run: |
          ARGS=""
          if [ -n "$SLUGS" ]; then
            ARGS="--slugs $SLUGS"
          else
            ARGS="--slug-pattern $SLUG_PATTERN --verdict $VERDICT"
            [ "$BEHAVIOURAL" = "true" ] && ARGS="$ARGS --require-behavioural"
          fi
          python scripts/verify-cohort.py \
            data/registry-snapshots/latest.json \
            $ARGS \
            --limit "$LIMIT" \
            --output cohort-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cohort-results
          path: cohort-results.json
          retention-days: 14
