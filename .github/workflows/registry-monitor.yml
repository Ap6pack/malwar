# ClawHub registry monitor.
#
# Runs `malwar crawl monitor` on a schedule and commits the snapshot + diff to
# the `registry-snapshots` branch so `git log -p registry-snapshots` is a
# permanent, auditable record of what changed day over day.
#
# Scans the whole registry with the rule engine + threat intel (fast, free, 100%
# recall on the benchmark), and escalates ONLY the ambiguous band — skills the
# rules flagged short of a confident verdict — to the Anthropic LLM for a
# budget-capped deep-dive second opinion. Confident-clean and confident-malicious
# skills are never escalated, so LLM spend tracks the small uncertain middle.
#
# Two cadences:
#   * Daily (06:00 UTC) — INCREMENTAL. Only skills whose version/updated_at
#     changed since the last snapshot are re-fetched and re-scanned. The first
#     runs build the baseline (see --max-scans below); after that each run is
#     cheap and fast.
#   * Weekly (Sunday 07:00 UTC) — FULL (`--full`). Re-scans every skill to catch
#     silent same-version content swaps (trojanized updates that keep the same
#     version number), which incremental detection would otherwise miss.
#
# Why a dedicated branch and not `main`? `main` is protected (PR + required
# checks), so a scheduled bot cannot push to it. The snapshot history therefore
# lives on its own long-running `registry-snapshots` branch, created
# automatically on the first run.

name: Registry Monitor

on:
  schedule:
    # Every 8h while the baseline builds. ClawHub allows ~120 req/min and a
    # full pass over the registry is ~10h of request time at that ceiling, so
    # throughput comes from running more often and for longer -- NOT from
    # raising concurrency, which would push past their documented limit.
    - cron: "0 2,10,18 * * *" # 02:00 / 10:00 / 18:00 UTC — incremental
    - cron: "0 7 * * 0" # Sunday 07:00 UTC — full re-scan
  workflow_dispatch: # manual "run now" from the Actions tab
    inputs:
      full:
        description: "Force a full re-scan of every skill"
        type: boolean
        default: false
      escalate_budget:
        description: "Max skills to LLM-verify this run (per-run API cap)"
        type: string
        default: "200"
      page_size:
        description: "Skills per listing page (larger = fewer requests to enumerate)"
        type: string
        default: "250"

# Never let two sweeps race on the snapshot history / the push.
concurrency:
  group: registry-monitor
  cancel-in-progress: false

permissions:
  contents: write # push snapshots to the registry-snapshots branch

jobs:
  monitor:
    name: Sweep registry and commit report
    runs-on: ubuntu-latest
    # Sized for --max-scans at ClawHub's ~2 req/s ceiling, with generous slack:
    # 12,000 scans is ~145 min of request time, and per-request latency varies
    # day to day. The previous 60 min was nearly breached (a 56.8 min sweep on
    # 2026-08-01) because enumeration cost grows with the registry, so leave
    # real headroom rather than trimming to the observed figure.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install malwar
        run: pip install -e "."

      - name: Restore snapshot baseline from data branch
        run: |
          mkdir -p data/registry-snapshots
          # Start clean so a stale/empty baseline can never reach the monitor.
          rm -f data/registry-snapshots/latest.json
          # Only write the baseline when the data branch AND the file both exist
          # (checked before the redirect, so we never create an empty file).
          if git fetch origin registry-snapshots 2>/dev/null \
            && git cat-file -e origin/registry-snapshots:data/registry-snapshots/latest.json 2>/dev/null; then
            git show origin/registry-snapshots:data/registry-snapshots/latest.json \
              > data/registry-snapshots/latest.json
            echo "Restored baseline from registry-snapshots branch."
          else
            echo "No baseline yet — first run (cold start, diff against nothing)."
          fi

      - name: Sweep registry and diff against baseline
        env:
          MALWAR_ANTHROPIC_API_KEY: ${{ secrets.MALWAR_ANTHROPIC_API_KEY }}
          # Full re-scan on the weekly cron or when manually requested;
          # incremental otherwise.
          IS_WEEKLY: ${{ github.event.schedule == '0 7 * * 0' }}
          DISPATCH_FULL: ${{ github.event.inputs.full }}
          # Manual dispatch may raise the per-run LLM verification cap; scheduled
          # runs use the steady-state default (200).
          ESCALATE_BUDGET: ${{ github.event.inputs.escalate_budget || '200' }}
          # Listing page size; larger means fewer requests to enumerate the ~72k
          # registry (the API returns its own max if this exceeds it). Every run
          # pays the full enumeration before scanning anything, so at 250/page
          # that is ~287 requests instead of ~717 -- roughly 4 minutes saved per
          # run, for free.
          PAGE_SIZE: ${{ github.event.inputs.page_size || '250' }}
        run: |
          FULL=""
          if [ "$IS_WEEKLY" = "true" ] || [ "$DISPATCH_FULL" = "true" ]; then
            FULL="--full"
            echo "Mode: FULL re-scan (every skill)."
          else
            echo "Mode: incremental (only changed skills)."
          fi
          echo "Escalation budget: ${ESCALATE_BUDGET}"
          echo "Listing page size: ${PAGE_SIZE}"
          # The whole-registry sweep runs the rule engine + threat intel (fast,
          # free, 100% recall on the benchmark). Only the AMBIGUOUS band — skills
          # the rules flagged short of a confident verdict — is escalated to the
          # Anthropic LLM for a deep-dive second opinion (which can raise a sneaky
          # skill or clear a false positive). Confident-clean and confident-
          # malicious skills are never escalated, and --escalate-budget caps the
          # per-run LLM spend. The free local HF classifier tier is available for
          # local runs (`--escalate-backend hf|tiered`, needs the [hf] extra) but
          # is kept out of CI to avoid a heavy torch install on the critical path.
          #
          # ClawHub is rate-limited (~120 req/min) and the registry is ~72k
          # skills, so a full pass is ~10h of request time and cannot fit in one
          # CI window. --max-scans caps scans per run; the overflow is deferred
          # and picked up next run (least-recently-scanned first), so the
          # baseline builds over successive runs, then runs only touch what
          # changed. Throughput comes from longer and more frequent runs, which
          # respect their per-minute limit, rather than from higher concurrency,
          # which would not.
          malwar crawl monitor \
            --snapshot-dir data/registry-snapshots \
            --format json \
            --output data/registry-snapshots/latest-diff.json \
            --escalate-backend anthropic \
            --escalate-budget "$ESCALATE_BUDGET" \
            --max-scans 12000 \
            --page-size "$PAGE_SIZE" \
            $FULL

      - name: Post scan summary to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # Report verdict counts for this sweep. Never fatal: a missing secret
          # or a Discord hiccup must not fail the run or block the publish.
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "No DISCORD_WEBHOOK secret set - skipping Discord summary."
            exit 0
          fi
          SNAP=data/registry-snapshots/latest.json
          if [ ! -f "$SNAP" ]; then
            echo "No snapshot to report - skipping."
            exit 0
          fi
          MAL=$(jq '[.skills[]|select(.verdict=="MALICIOUS")]|length' "$SNAP")
          SUS=$(jq '[.skills[]|select(.verdict=="SUSPICIOUS")]|length' "$SNAP")
          CAU=$(jq '[.skills[]|select(.verdict=="CAUTION")]|length' "$SNAP")
          CLN=$(jq '[.skills[]|select(.verdict=="CLEAN")]|length' "$SNAP")
          UNK=$(jq '[.skills[]|select(.verdict=="UNKNOWN")]|length' "$SNAP")
          TOTAL=$(jq '.skills|length' "$SNAP")
          SCANNED=$(jq '.scanned_count // 0' "$SNAP")
          ESC=$(jq '.escalated_count // 0' "$SNAP")
          STALE=$(jq '[.skills[]|select(.stale==true)]|length' "$SNAP")
          ENUM=$(jq '.enumerated_count // 0' "$SNAP")
          COMPLETE=$(jq '.enumeration_complete' "$SNAP")
          CARRIED=$(jq '.carried_forward_count // 0' "$SNAP")

          # Coverage against the registry we actually enumerated. Verdict counts
          # alone are NOT a health signal: during the 2026-07 enumeration outage
          # this summary would have reported a few thousand happy-looking skills
          # while silently seeing 5% of the registry. Lead with enumeration
          # health so that failure mode is impossible to miss again.
          VERDICTED=$((TOTAL - UNK))
          if [ "$ENUM" -gt 0 ]; then
            REG="$ENUM"
            PCT=$(( VERDICTED * 100 / REG ))
            COVERAGE="**${VERDICTED}/${REG} (${PCT}%)** have a verdict"
          else
            # Snapshot predates enumeration-health tracking: registry size is
            # unknown, so do NOT infer a percentage from tracked skills -- that
            # reads as healthy precisely when enumeration is broken.
            REG=0; PCT=0
            COVERAGE="**${VERDICTED}** have a verdict (registry size unknown)"
          fi

          if [ "$ENUM" -eq 0 ]; then
            COLOR=15158332   # red
            HEALTH="⚠️ ENUMERATION HEALTH UNKNOWN - snapshot reports no enumerated_count; coverage cannot be verified"
          elif [ "$COMPLETE" != "true" ]; then
            COLOR=15158332   # red - counts below cover only part of the registry
            HEALTH="⚠️ ENUMERATION INCOMPLETE - listed only ${ENUM}; counts below cover part of the registry"
          elif [ "$PCT" -lt 50 ]; then
            COLOR=16098851   # amber - enumeration fine, verdict coverage building
            HEALTH="Enumeration complete (${REG} skills). Verdict coverage still building."
          else
            COLOR=3066993    # green
            HEALTH="Enumeration complete (${REG} skills)."
          fi

          DESC="${HEALTH}
          Coverage: ${COVERAGE} - scanned ${SCANNED} this run, ${STALE} stale, ${CARRIED} carried forward, ${ESC} LLM-verified.
          MALICIOUS counts are corroborated/verified, not raw single-rule hits."

          PAYLOAD=$(jq -n \
            --arg title "malwar registry sweep $(date -u +%Y-%m-%d)" \
            --arg desc "$DESC" --argjson color "$COLOR" \
            --argjson mal "$MAL" --argjson sus "$SUS" --argjson cau "$CAU" \
            --argjson cln "$CLN" --argjson unk "$UNK" --argjson reg "$REG" \
            '{embeds:[{title:$title, description:$desc, color:$color, fields:[
              {name:"MALICIOUS",       value:($mal|tostring), inline:true},
              {name:"SUSPICIOUS",      value:($sus|tostring), inline:true},
              {name:"CAUTION",         value:($cau|tostring), inline:true},
              {name:"CLEAN",           value:($cln|tostring), inline:true},
              {name:"Not yet scanned", value:($unk|tostring), inline:true},
              {name:"Registry size",
               value:(if $reg>0 then ($reg|tostring) else "unknown" end), inline:true}
            ]}]}')
          if curl -sS -X POST -H "Content-Type: application/json" \
               -d "$PAYLOAD" "$DISCORD_WEBHOOK" >/dev/null; then
            echo "Posted sweep summary to Discord."
          else
            echo "Discord post failed (non-fatal)."
          fi

      - name: Publish snapshot to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save the freshly generated snapshot files, then clear them from the
          # working tree. Once the data branch exists, `git checkout` refuses to
          # switch when untracked files here would be overwritten by the branch's
          # tracked versions — so we stash to $tmp and remove them first, then
          # overlay them back after the switch.
          tmp="$(mktemp -d)"
          cp -a data/registry-snapshots/. "$tmp/"
          rm -rf data/registry-snapshots

          # Move onto the data branch (create an orphan branch on the first run).
          if git rev-parse --verify origin/registry-snapshots >/dev/null 2>&1; then
            git checkout -B registry-snapshots origin/registry-snapshots
          else
            git checkout --orphan registry-snapshots
            git reset # unstage main's tree; commit only the snapshots below
          fi

          # Layer the fresh files on top of the branch's accumulated history.
          mkdir -p data/registry-snapshots
          cp -a "$tmp/." data/registry-snapshots/

          git add data/registry-snapshots
          if git diff --cached --quiet; then
            echo "No registry changes today — nothing to commit."
          else
            git commit -m "chore(monitor): registry snapshot $(date -u +%Y-%m-%d)"
            git push origin registry-snapshots
          fi
